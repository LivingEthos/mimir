[workspace]
resolver = "2"
members = [
    "crates/mimir-cli",
    "crates/mimir-core",
    "crates/mimir-context",
    "crates/mimir-retrieval",
    "crates/mimir-index",
    "crates/mimir-providers",
    "crates/mimir-tools",
    "crates/mimir-security",
    "crates/mimir-runs",
    "crates/mimir-memory",
    "crates/mimir-eval",
    "crates/mimir-schemas",
    "crates/mimir-telemetry",
]

[workspace.package]
edition = "2021"
rust-version = "1.83"
license = "Apache-2.0"
authors = ["Mimir contributors"]
repository = "https://github.com/mimir/mimir"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.42", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
bincode = "2"
typify = "0.2"

# Schema validation
jsonschema = "0.28"

# Errors
thiserror = "1"
anyhow = "1"

# Logging / telemetry
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.27"
opentelemetry = "0.27"
opentelemetry_sdk = "0.27"

# CLI parsing
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "gzip"] }

# Hashing / IDs
sha2 = "0.10"
blake3 = "1"
uuid = { version = "1", features = ["v4", "serde"] }
serde_json_canonicalizer = "0.3"

# Time
time = { version = "0.3", features = ["serde", "formatting"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }

# File / path / fs
walkdir = "2"
ignore = "0.4"
camino = "1"

# Concurrency
rayon = "1"
dashmap = "6"
parking_lot = "0.12"

# Tree-sitter (indexing)
tree-sitter = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"

# Tokenizers
tokenizers = "0.21"
tiktoken-rs = "0.6"

# Git
gix = { version = "0.69", default-features = false, features = ["max-performance-safe", "blocking-network-client"] }

# Search
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"

# Diff / patch
similar = "2"
imara-diff = "0.1"

# LSP / JSON-RPC (Phase 6 SDK/server)
tower-lsp = "0.20"
lsp-types = "0.97"

# SQLite (Phase 6 only)
rusqlite = { version = "0.32", features = ["bundled", "serde_json"] }

# Encoding
base64 = "0.22"
hex = "0.4"

# Validation / formatting helpers
regex = "1"
once_cell = "1"
indexmap = "2"
itertools = "0.13"
bytes = "1"
secrecy = "0.10"

# TUI (Phase 6 only)
ratatui = "0.30"
crossterm = "0.29"

# Testing
insta = { version = "1", features = ["yaml", "json"] }
rstest = "0.23"
proptest = "1"
assert_cmd = "2"
predicates = "3"
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }
wiremock = "0.6"
