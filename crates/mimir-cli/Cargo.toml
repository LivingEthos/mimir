[package]
name = "mimir-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "mimir"
path = "src/main.rs"

[dependencies]
mimir-core = { path = "../mimir-core" }
mimir-schemas = { path = "../mimir-schemas" }
mimir-telemetry = { path = "../mimir-telemetry" }
mimir-security = { path = "../mimir-security" }
mimir-runs = { path = "../mimir-runs" }
mimir-tools = { path = "../mimir-tools" }
mimir-index = { path = "../mimir-index" }
mimir-retrieval = { path = "../mimir-retrieval" }
mimir-providers = { path = "../mimir-providers" }
mimir-context = { path = "../mimir-context" }
mimir-memory = { path = "../mimir-memory" }
mimir-eval = { path = "../mimir-eval" }
mimir-edit = { path = "../mimir-edit" }
mimir-review = { path = "../mimir-review" }
mimir-subagents = { path = "../mimir-subagents" }
mimir-server = { path = "../mimir-server" }
mimir-tui = { path = "../mimir-tui" }
clap = { version = "4", features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
camino = { workspace = true }
