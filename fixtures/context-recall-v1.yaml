    task: Check telemetry event structure
    gold:
      files: [crates/mimir-telemetry/src/lib.rs]
      ranges:
        - { path: crates/mimir-telemetry/src/lib.rs, start: 1, end: 120 }
    allowed_mode: plan
    allowed_caps_to_test: [64000]
  - schema_version: 1
    id: fixture-14-mode3-packet-share
    repo_path: "."
    base_commit: e51ee9ef
    task: Share a packet with secrets redacted
    gold:
      files: [docs/context-packets.md]
      ranges:
        - { path: docs/context-packets.md, start: 1, end: 160 }
    allowed_mode: explain
    allowed_caps_to_test: [64000]
  - schema_version: 1
    id: fixture-15-mode5-eval-harness
    repo_path: "."
    base_commit: e51ee9ef
    task: Run eval with fixture dataset
    gold:
      files: [crates/mimir-eval/src/lib.rs]
